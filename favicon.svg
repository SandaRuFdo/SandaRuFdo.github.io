<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#02050b"/>
    </radialGradient>
    <linearGradient id="alienGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00ffa3"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c14"/>
      <stop offset="100%" stop-color="#08182b"/>
    </linearGradient>
  </defs>
  <!-- Background Circle with Neon Cyan Ring -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGlow)" stroke="#00e5ff" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="4,2" opacity="0.6"/>

  <!-- Futuristic Cyber Alien Head -->
  <path d="M 50 16 C 72 16 82 28 82 46 C 82 62 70 78 50 87 C 30 78 18 62 18 46 C 18 28 28 16 50 16 Z" 
        fill="url(#alienGrad)" stroke="#00ffff" stroke-width="1.5"/>

  <!-- Slanted Slit Cyber Alien Eyes -->
  <path d="M 31 43 C 41 41 45 49 43 57 C 39 63 29 59 27 51 C 27 46 29 43 31 43 Z" fill="url(#eyeGrad)" stroke="#00e5ff" stroke-width="1"/>
  <path d="M 69 43 C 59 41 55 49 57 57 C 61 63 71 59 73 51 C 73 46 71 43 69 43 Z" fill="url(#eyeGrad)" stroke="#00e5ff" stroke-width="1"/>

  <!-- Neon Glowing Eye Pupils -->
  <ellipse cx="37" cy="50" rx="3.5" ry="5.5" fill="#00ffff"/>
  <ellipse cx="63" cy="50" rx="3.5" ry="5.5" fill="#00ffff"/>
  
  <!-- White Glints -->
  <circle cx="39" cy="48" r="1.2" fill="#ffffff"/>
  <circle cx="65" cy="48" r="1.2" fill="#ffffff"/>

  <!-- Forehead HUD Lines -->
  <path d="M 50 22 L 50 32 M 43 26 L 57 26" stroke="#03243b" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Chin Node -->
  <circle cx="50" cy="79" r="1.8" fill="#00ffff"/>
</svg>
